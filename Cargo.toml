[package]
name = "ali-wan3-tool"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1"
app-single-instance = "0.1"
base64 = "0.22"
chrono = "0.4"
gpui-kit = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = "symbols"
panic = "abort"
